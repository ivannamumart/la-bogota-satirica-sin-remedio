<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#f1efe6"/>
<meta name="description" content="Cartografía especulativa navegable de La Bogotá satírica de Sin remedio, proyecto de Humanidades Digitales."/>
<title>La Bogotá satírica de Sin remedio · Un mundo por recorrer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="world" role="application" aria-label="Mundo tridimensional navegable de La Bogotá satírica de Sin remedio"></div>
<div id="grain" aria-hidden="true"></div>
<header class="masthead" aria-label="Título del proyecto">
  <div class="mast-kicker">BOGOTÁ · 1972</div>
  <h1>La Bogotá satírica <em>de Sin remedio</em></h1>
</header>
<nav class="controls" aria-label="Controles del visualizador">
  <button id="center" class="icon-control" type="button" title="Centrar el mundo" aria-label="Centrar el mundo">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v4m0 10v4M3 12h4m10 0h4"/><circle cx="12" cy="12" r="4.2"/></svg>
  </button>
  <button id="moon" class="moon-control" type="button" aria-label="Sobre el proyecto" title="Sobre el proyecto">
    <span class="moon-label">SOBRE EL PROYECTO</span>
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M22.7 24.7a12 12 0 1 1-15.4-17.4 11.7 11.7 0 0 0 15.4 17.4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
</nav>
<div id="place-caption" class="place-caption" aria-live="polite"><span id="place-number"></span><span id="place-name"></span></div>
<div id="subtitles" class="subtitles" aria-live="polite" aria-hidden="true">
  <div class="speaker" id="speaker"></div>
  <p id="subtitle-text"></p>
  <div class="source" id="source"></div>
</div>
<div id="decisions" class="decisions" aria-hidden="true">
  <p class="decision-eyebrow">LA HISTORIA PUEDE CAMBIAR</p>
  <h2>¿Qué hará Ignacio?</h2>
  <div id="choices" class="choice-grid"></div>
</div>
<div id="scene-hint" class="scene-hint" aria-live="polite"></div>
<div id="fade" class="fade" aria-hidden="true"></div>
<section id="about" class="about" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="about-title">
  <button id="about-close" class="about-close" type="button" aria-label="Cerrar y regresar al mundo">×</button>
  <div class="about-content"><div class="about-small">LA BOGOTÁ SATÍRICA DE SIN REMEDIO</div><h2 id="about-title">Sobre el proyecto</h2><p>En construcción.</p></div>
</section>
<div id="loader" class="loader" aria-live="polite"><span>Una ciudad comienza a aparecer…</span></div>
<div id="error" class="error" role="alert" hidden><h2>El mundo no pudo iniciarse</h2><p id="error-message">Revisa que tu navegador permita WebGL.</p><button id="retry">Reintentar</button></div>
<script type="module" src="/src/main.ts"></script>
</body></html>
