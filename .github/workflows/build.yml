name: Compilación y prueba WebGL real
on:
  push:
    branches: [main, redisenio-cinematografico-v2, v04-review]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: version-web-compilada
          path: dist/
          if-no-files-found: error
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Levantar servidor Vite
        run: npm run preview -- --host 127.0.0.1 > /tmp/bogota-vite.log 2>&1 &
      - run: node tests/smoke.mjs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-bogota-webgl
          path: docs/qa/
          if-no-files-found: warn
